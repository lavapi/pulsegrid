name: Feature request
description: Suggest something new or a change to how it works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. Screens or examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried
      description: Optional. Workarounds or other tools you've used.
