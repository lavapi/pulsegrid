name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: devdash_owner
          POSTGRES_PASSWORD: devdash_owner_local
          POSTGRES_DB: devdash
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devdash_owner -d devdash"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: |
          for stack in new-stack existing-stack; do
            terraform -chdir="$stack" init -backend=false
            terraform -chdir="$stack" validate
          done
