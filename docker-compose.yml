services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: devdash_owner
      POSTGRES_PASSWORD: devdash_owner_local
      POSTGRES_DB: devdash
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devdash_owner -d devdash"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
